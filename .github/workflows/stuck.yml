# Manual trigger so it doesn't run on every push
on:
  workflow_dispatch:

jobs:
  # This job hangs forever
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # safety net
    steps:
      - name: Start work
        run: echo "Working..."

      - name: Hang forever
        run: sleep infinity

  # This job uses if: always() so it ALWAYS runs — even if 'work' fails
  # or is cancelled. But because it 'needs: work', it stays queued/stuck
  # waiting for 'work' to finish, which never happens until the timeout.
  cleanup:
    runs-on: ubuntu-latest
    needs: work
    if: always()
    timeout-minutes: 30   # safety net
    steps:
      - name: Cleanup
        run: echo "This only runs after 'work' resolves — so it stays stuck."
